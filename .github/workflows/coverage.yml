name: Coverage
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.rst"
      - "**/*.ipynb"
      - "docs.toml"
      - "docs/**"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.rst"
      - "**/*.ipynb"
      - "docs.toml"
      - "docs/**"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"

jobs:
  build:
    env:
      buildDir: "${{ github.workspace }}/build/"
      ASAN_OPTIONS: "detect_leaks=0:detect_container_overflow=0" # Not read for this yet..
      NWN_ROOT: "${{ github.workspace }}/nwn/"
      CI_GITHUB_ACTIONS: "1"
      CCACHE_DIR: "${{ github.workspace }}/ccache/"

    name: Linux GCC Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get current date
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Install gcc-15
        uses: ./.github/actions/apt-setup
        timeout-minutes: 10
        with:
          ppa: ppa:ubuntu-toolchain-r/test
          packages: gcc-15 g++-15 lcov doxygen ccache

      - name: Select gcc-15
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 150 --slave /usr/bin/g++ g++ /usr/bin/g++-15 --slave /usr/bin/gcov gcov /usr/bin/gcov-15

      - name: Set up ccache
        run: |
          ccache --set-config=cache_dir=${{ github.workspace }}/ccache
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true

      # Install latest CMake.
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.29.4

      - name: cache ccache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/ccache
          key: ${{ runner.os }}-coverage-${{ env.DATE }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      - name: cache nwn
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/nwn/
          key: cache-nwn-3e02cddcea5d0ae82111a3038f14aef6c14d05d9

      - name: Ensure NWN dedicated server
        run: |
          ./scripts/ci/ensure_nwn.sh

      - name: Configure
        run: |
          cmake --preset ci-coverage

      - name: Build
        run: |
          cmake --build --preset default

      - name: Test
        run: |
          ctest --preset default --parallel 2

      - name: Coverage
        run: |
          lcov --rc geninfo_unexecuted_blocks=1 --directory . --capture --output-file coverage.info --ignore-errors mismatch,unexecuted
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/external/*' --output-file coverage.info
          lcov --list coverage.info
          bash <(curl -s https://codecov.io/bash) -f coverage.info -t ${{ secrets.CODECOV_TOKEN }} || echo "Codecov did not collect coverage reports"
